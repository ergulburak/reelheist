<!doctype html>
<html lang="en" data-theme="red">
<head>
  <meta charset="utf-8">
  <title>ReelHeist</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <header class="head">
    <button type="button" id="btnBack" class="iconbtn" data-i18n-aria="overlay_close" hidden></button>
    <span id="headerLogo" class="logo"></span>
    <span id="headerTitle" class="logo" hidden></span>
    <span id="doneBadge" class="done-badge" hidden><span data-i18n="badge_downloaded"></span></span>
    <button type="button" id="btnSettings" class="iconbtn" data-i18n-title="settings_summary" data-i18n-aria="settings_summary"></button>
  </header>

  <section id="page" class="view">
    <div id="preview" class="loop" hidden>
      <div class="film"></div>
      <img id="previewImg" alt="" hidden>
      <video id="previewVideo" muted loop playsinline></video>
      <div class="shade"></div>
      <div class="inner">
        <span id="previewMeta" class="meta"></span>
        <h3 id="previewTitle"></h3>
      </div>
    </div>

    <div class="body">
      <div id="followCard" class="follow-card" hidden></div>
      <div id="pageStatus" class="status"></div>
      <div id="followRow" class="hint follow-row" hidden></div>

      <div id="searchingBox" class="state-box" hidden>
        <div class="skel-card"></div>
        <div class="skel-row"></div>
        <div id="searchingPrompt" class="searching-prompt" hidden>
          <div class="muted small" data-i18n="status_press_play"></div>
          <button type="button" id="startPlayerBtn" data-i18n="btn_start_player"></button>
        </div>
      </div>

      <div id="errorBox" class="state-box" hidden>
        <div id="errorText" class="err"></div>
        <button type="button" id="reloadRetryBtn" class="primary" data-i18n="btn_reload_retry"></button>
        <details id="errorDetailsWrap" class="more" hidden>
          <summary data-i18n="lbl_error_details"></summary>
          <pre id="errorDetail" class="err-detail"></pre>
        </details>
      </div>

      <div id="noHelperBox" class="state-box" hidden>
        <div class="err" data-i18n="status_no_helper"></div>
        <button type="button" id="noHelperBtn" class="primary" data-i18n="btn_download_installer"></button>
      </div>

      <div id="pageForm" hidden>
        <div class="chips-area">
          <div id="chipBar" class="chip-bar">
            <button type="button" id="chip-quality" class="chip on" aria-expanded="false"></button>
            <button type="button" id="chip-audio" class="chip on" aria-expanded="false"></button>
            <button type="button" id="chip-subs" class="chip on" aria-expanded="false"></button>
            <button type="button" id="chip-subsonly" class="chip" aria-pressed="false"></button>
          </div>
          <div id="menu-quality" class="chip-menu" hidden>
            <div id="qualityList" class="menu-list"></div>
            <select id="quality" hidden></select>
          </div>
          <div id="menu-audio" class="chip-menu" hidden>
            <div id="audios"></div>
          </div>
          <div id="menu-subs" class="chip-menu" hidden>
            <div id="subs"></div>
          </div>
        </div>

        <div class="edit-row">
          <button type="button" id="editToggle" class="link edit-link" data-i18n="btn_edit_meta"></button>
        </div>

        <div id="metaEditor" class="meta-editor" hidden>
          <div class="row">
            <label class="grow"><span data-i18n="lbl_name"></span> <input id="name" type="text"></label>
          </div>
          <div class="row">
            <label><span data-i18n="lbl_kind"></span>
              <select id="kind"><option value="episode" data-i18n="kind_episode"></option><option value="movie" data-i18n="kind_movie"></option><option value="video" data-i18n="kind_video"></option></select>
            </label>
            <label class="ep"><span data-i18n="lbl_season"></span> <input id="season" type="number" min="0" max="99"></label>
            <label class="ep"><span data-i18n="lbl_episode"></span> <input id="episode" type="number" min="0" max="9999"></label>
            <label class="mv"><span data-i18n="lbl_year"></span> <input id="year" type="number" min="1900" max="2100"></label>
            <label class="vd grow"><span data-i18n="lbl_channel"></span> <input id="channel" type="text"></label>
          </div>
          <div class="row" id="sourceRow">
            <label class="grow"><span data-i18n="lbl_source"></span> <select id="source"></select></label>
          </div>
          <div class="muted small" id="target"></div>
        </div>

        <div id="existsBox" class="exists" hidden>
          <div id="existsLine" class="exists-line"></div>
          <div class="row exists-actions">
            <button type="button" id="existsPlay" class="btn-secondary"><span data-i18n="btn_play"></span></button>
            <button type="button" id="existsFolder" class="btn-secondary"><span data-i18n="btn_folder"></span></button>
          </div>
          <button type="button" id="redownload" class="link" data-i18n="btn_redownload"></button>
        </div>

        <div id="pageProgressWrap" hidden>
          <div id="pageProgress" class="prog">
            <i id="pageProgressFill"></i>
            <span id="pageProgressLeft"></span>
            <small id="pageProgressRight"></small>
          </div>
          <div id="downloadingHint" class="hint" data-i18n="downloading_close_hint"></div>
        </div>

        <button type="button" id="download" class="btn-main">
          <span id="downloadMainLabel" class="btn-main-left"><span data-i18n="download"></span></span>
          <small id="downloadEst"></small>
        </button>

        <div id="seasonHintRow" class="hint" hidden></div>
      </div>

      <details id="playlistBox" hidden>
        <summary data-i18n="playlist_summary"></summary>
        <div id="playlistContent">
          <button type="button" id="findPlaylist" data-i18n="btn_find_playlist"></button>
        </div>
      </details>

      <details id="seasonBox" hidden>
        <summary data-i18n="season_summary"></summary>
        <div id="seasonContent">
          <button type="button" id="findEpisodes" data-i18n="btn_find_episodes"></button>
        </div>
      </details>
    </div>
  </section>

  <section id="queue" class="view" hidden>
    <div class="body">
      <div class="queue-head">
        <button type="button" id="clearDone" class="link" data-i18n="btn_clear_done"></button>
      </div>
      <div id="jobs"></div>
    </div>
  </section>

  <section id="settings" class="view" hidden>
    <div class="set-tabs" id="setTabs" role="tablist" data-i18n-aria="settings_summary">
      <button type="button" role="tab" id="setTab-look" aria-controls="setPanel-look" data-set-tab="look" data-i18n="set_tab_look"></button>
      <button type="button" role="tab" id="setTab-download" aria-controls="setPanel-download" data-set-tab="download" data-i18n="set_tab_download"></button>
      <button type="button" role="tab" id="setTab-repos" aria-controls="setPanel-repos" data-set-tab="repos" data-i18n="set_tab_repos"></button>
      <button type="button" role="tab" id="setTab-about" aria-controls="setPanel-about" data-set-tab="about" data-i18n="set_tab_about"></button>
    </div>
    <div class="body set" id="settingsBody">
      <div class="set-panel" id="setPanel-look" role="tabpanel" aria-labelledby="setTab-look" data-set-panel="look">
        <div class="grp">
          <div class="lbl" data-i18n="set_grp_theme"></div>
          <div class="sw" id="themeSwatches">
            <button type="button" class="sw-item" data-theme-choice="red">
              <i class="t" data-theme="red"></i>
              <span data-i18n="theme_red"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="black-beige">
              <i class="t" data-theme="black-beige"></i>
              <span data-i18n="theme_black_beige"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="beige-black">
              <i class="t" data-theme="beige-black"></i>
              <span data-i18n="theme_beige_black"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="midnight">
              <i class="t" data-theme="midnight"></i>
              <span data-i18n="theme_midnight"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="emerald">
              <i class="t" data-theme="emerald"></i>
              <span data-i18n="theme_emerald"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="amethyst">
              <i class="t" data-theme="amethyst"></i>
              <span data-i18n="theme_amethyst"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="amber">
              <i class="t" data-theme="amber"></i>
              <span data-i18n="theme_amber"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="snow">
              <i class="t" data-theme="snow"></i>
              <span data-i18n="theme_snow"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="rose">
              <i class="t" data-theme="rose"></i>
              <span data-i18n="theme_rose"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="velvet">
              <i class="t" data-theme="velvet"></i>
              <span data-i18n="theme_velvet"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="neon">
              <i class="t" data-theme="neon"></i>
              <span data-i18n="theme_neon"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="sunset">
              <i class="t" data-theme="sunset"></i>
              <span data-i18n="theme_sunset"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="arctic">
              <i class="t" data-theme="arctic"></i>
              <span data-i18n="theme_arctic"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="graphite">
              <i class="t" data-theme="graphite"></i>
              <span data-i18n="theme_graphite"></span>
            </button>
            <button type="button" class="sw-item" data-theme-choice="lavender">
              <i class="t" data-theme="lavender"></i>
              <span data-i18n="theme_lavender"></span>
            </button>
          </div>
        </div>

        <div class="grp">
          <div class="lbl" data-i18n="set_grp_lang"></div>
          <select id="setLang"></select>
        </div>

        <div class="grp">
          <div class="lbl" data-i18n="lbl_motion"></div>
          <select id="setMotion">
            <option value="auto" data-i18n="motion_auto"></option>
            <option value="on" data-i18n="motion_on"></option>
            <option value="off" data-i18n="motion_off"></option>
          </select>
        </div>

        <div class="grp">
          <div class="lbl" data-i18n="set_grp_overlay"></div>
          <label class="check"><input id="setOverlay" type="checkbox" checked> <span data-i18n="lbl_overlay"></span></label>
          <div class="muted small" data-i18n="set_overlay_hint"></div>
        </div>
      </div>

      <div class="set-panel" id="setPanel-download" role="tabpanel" aria-labelledby="setTab-download" data-set-panel="download" hidden>
        <div class="grp">
          <div class="lbl" data-i18n="set_grp_defaults"></div>
          <label><span data-i18n="lbl_quality"></span> <select id="setDefaultQuality"></select></label>
          <div class="set-field" role="group" aria-labelledby="lblAudioLangs">
            <span id="lblAudioLangs" data-i18n="lbl_audio_langs"></span>
            <div id="setDefaultAudio" class="lang-picker"></div>
            <span class="set-hint" data-i18n="hint_audio_auto"></span>
          </div>
          <div class="set-field" role="group" aria-labelledby="lblSubLangs">
            <span id="lblSubLangs" data-i18n="lbl_sub_langs"></span>
            <div id="setDefaultSubs" class="lang-picker"></div>
            <span class="set-hint" data-i18n="hint_subs_auto"></span>
          </div>
          <div class="set-field">
            <label class="check"><input id="setEmbedSubs" type="checkbox" checked> <span data-i18n="lbl_embed_subs"></span></label>
            <span class="set-hint" data-i18n="hint_embed_subs"></span>
            <label class="check"><input id="setKeepSrt" type="checkbox" checked> <span data-i18n="lbl_keep_srt"></span></label>
            <span class="set-hint" data-i18n="hint_keep_srt"></span>
          </div>
        </div>

        <div class="grp">
          <div class="lbl" data-i18n="lbl_outdir"></div>
          <div class="outdir-row">
            <input id="outDir" type="text" readonly>
            <button type="button" id="pickOutDir" class="btn-pick-folder"><span data-i18n="btn_change_folder"></span></button>
          </div>
          <div id="outDirStatus" class="status small" hidden></div>
        </div>

        <div class="grp">
          <label><span data-i18n="lbl_parallel"></span> <select id="setParallel">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select></label>
          <div class="muted small" data-i18n="hint_parallel"></div>
        </div>

        <div class="grp">
          <div class="lbl" data-i18n="set_grp_follow"></div>
          <div id="followList"></div>
        </div>

        <div class="grp">
          <label><span data-i18n="lbl_notify"></span> <select id="setNotify">
            <option value="all" data-i18n="notify_all"></option>
            <option value="errors" data-i18n="notify_errors"></option>
            <option value="off" data-i18n="notify_off"></option>
          </select></label>
        </div>

        <div class="grp">
          <div class="lbl" data-i18n="set_grp_memory"></div>
          <span class="set-hint" data-i18n="hint_site_memory"></span>
          <button type="button" id="clearMemoryBtn" class="btn-secondary full-width"></button>
        </div>
      </div>

      <div class="set-panel" id="setPanel-repos" role="tabpanel" aria-labelledby="setTab-repos" data-set-panel="repos" hidden>
        <div class="grp">
          <div class="lbl" data-i18n="set_grp_repos"></div>
          <div class="row repo-add-row">
            <input id="repoUrlInput" type="url" class="grow-input" data-i18n-placeholder="placeholder_repo_url">
            <button type="button" id="addRepoBtn" data-i18n="btn_add_repo"></button>
          </div>
          <div id="repoStatus" class="status small" hidden></div>
          <div id="reposList" class="repos-list"></div>
        </div>

        <div id="packsSection" class="grp packs-section" hidden>
          <div class="lbl packs-head">
            <span data-i18n="set_grp_packs"></span>
            <span id="packsCount" class="muted small packs-count"></span>
            <button type="button" id="updatePacksBtn" class="iconbtn small-iconbtn" data-i18n-title="btn_update_packs" data-i18n-aria="btn_update_packs"></button>
          </div>
          <input id="packSearchInput" type="search" data-i18n-placeholder="placeholder_search_packs">
          <div class="packs-table" role="table" data-i18n-aria="set_grp_packs">
            <div class="packs-th" role="row">
              <span role="columnheader" data-i18n="col_pack"></span>
              <span role="columnheader" data-i18n="col_version"></span>
              <span role="columnheader"></span>
            </div>
            <div id="packsList" class="packs-list" role="rowgroup"></div>
          </div>
          <label class="check"><input id="autoUpdatePacks" type="checkbox" checked> <span data-i18n="lbl_auto_update_packs"></span></label>
        </div>
      </div>

      <div class="set-panel" id="setPanel-about" role="tabpanel" aria-labelledby="setTab-about" data-set-panel="about" hidden>
        <div class="grp">
          <div class="lbl" data-i18n="set_grp_support"></div>
          <button type="button" id="supportBtn" class="btn-secondary full-width" data-i18n="btn_support"></button>
        </div>

        <div class="grp">
          <div class="lbl" data-i18n="set_grp_about"></div>
          <div class="about-row">
            <span id="aboutVersion" class="muted small"></span>
            <button type="button" id="checkUpdatesBtn" data-i18n="btn_check_updates"></button>
          </div>
          <div id="updateStatus" class="status small" hidden></div>
          <div class="about-links">
            <button type="button" id="githubLink" class="link" data-i18n="link_github"></button>
            <button type="button" id="licensesLink" class="link" data-i18n="link_licenses"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer id="statusBar" class="foot"></footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
